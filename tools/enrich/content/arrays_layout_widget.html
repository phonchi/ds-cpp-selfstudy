<div class="viz-layout">
<div>
<div class="viz-panel">
<div class="addr-row" id="addrVis" aria-label="陣列格子與位址"></div>
<div class="addr-steps mono" id="addrSteps"></div>
<div class="status-banner" id="addrStatus"><span class="status-icon">›</span><span class="status-text">點任一格，看位址怎麼算。</span></div>
<div class="controls-bar">
<label class="mono" style="font-size:.85rem;">元素型別 <select class="mono" id="addrSize" onchange="addrRender()" style="padding:.35rem;border-radius:6px;border:1px solid var(--card-border);">
<option value="8" selected>double（8 bytes）</option><option value="4">int（4 bytes）</option><option value="1">char（1 byte）</option>
</select></label>
<button class="btn btn-step" onclick="addrPick(4)">講義例：a[4]</button>
</div>
</div>
</div>
<div class="side-panel">
<div class="info-card">
<div class="ic-title">兩個直接推論</div>
<div style="font-size:.87rem;line-height:1.9;">① 存取任何 a[i] 的成本相同，<strong>不用走訪</strong>。<br>② 格子必須<strong>等寬</strong>，所以陣列的元素是同一種型別。</div>
</div>
<div class="info-card">
<div class="ic-title">假設</div>
<div style="font-size:.87rem;line-height:1.9;">陣列 a 有 6 個元素，基底位址 0x40（十進位 64）。a[6] 是尾端之後的位置，不屬於陣列。</div>
</div>
</div>
</div>
