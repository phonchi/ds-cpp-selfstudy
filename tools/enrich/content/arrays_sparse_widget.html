<div class="viz-layout">
<div>
<div class="viz-panel">
<div id="spGrid" style="display:grid;grid-template-columns:repeat(6,minmax(0,52px));gap:4px;justify-content:center;padding:.3rem;"></div>
<div class="mono" id="spStore" style="font-size:.82rem;line-height:1.9;min-height:70px;overflow-wrap:anywhere;"></div>
<div class="status-banner" id="spStatus"><span class="status-icon">›</span><span class="status-text">點格子放入非零值，再點一次歸零；下方顯示三種表示。</span></div>
<div class="controls-bar">
<button class="btn" onclick="spRandom()">隨機放 4 個非零</button>
<button class="btn" onclick="spClear()">清空</button>
</div>
</div>
</div>
<div class="side-panel">

<div class="info-card">
<div class="ic-title">稀疏度（sparsity）</div>
<div class="mono" id="spDensity" style="font-size:.9rem;"></div>
</div>
</div>
</div>
