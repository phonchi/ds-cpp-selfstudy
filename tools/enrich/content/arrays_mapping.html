<div class="viz-panel matrix-mapping" id="matrixMapping">
  <h3>一個矩陣，兩種記憶體排列</h3>
  <p>每格標示 (row, column) 與值。播放時依同一個邏輯順序取出元素，放入兩種排列的對應位置；點任一格可直接對照完整排列。</p>
  <div id="mappingGrid" class="mapping-grid" aria-label="3 列 4 欄邏輯矩陣"></div>
  <div class="mapping-pair">
    <div class="mapping-view"><h4>Row-major · 逐列儲存</h4><div class="memory-scroll" tabindex="0" aria-label="row-major 一維記憶體"><div id="mappingRow" class="memory-band"></div></div><p id="mappingRowFormula" class="mapping-formula"></p></div>
    <div class="mapping-view"><h4>Column-major · 逐欄儲存</h4><div class="memory-scroll" tabindex="0" aria-label="column-major 一維記憶體"><div id="mappingCol" class="memory-band"></div></div><p id="mappingColFormula" class="mapping-formula"></p></div>
  </div>
  <p class="mapping-address">假設基底位址 B = 1000、每個 int 佔 4 bytes。每格最下方的數字是 offset（可左右捲動記憶體帶）；實際 byte 位址還要乘上 4。</p>
  <div class="controls-bar">
    <button type="button" class="btn" id="mappingPlay">播放</button>
    <button type="button" class="btn" id="mappingStep">單步</button>
    <button type="button" class="btn" id="mappingReset">重設</button>
    <label>進度 <input id="mappingProgress" type="range" min="0" max="12" value="0"></label>
    <label>間隔 <select id="mappingDelay"><option value="1000">慢</option><option value="600" selected>中</option><option value="250">快</option></select></label>
  </div>
  <p id="mappingStatus" role="status" aria-live="polite">尚未放入元素（共 12 個）。</p>
</div>
