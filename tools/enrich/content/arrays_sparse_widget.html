<div class="viz-layout">
<div>
<div class="viz-panel">
<div id="spGrid" class="sp-grid" aria-label="5 列 6 欄矩陣"></div>
<div class="controls-bar">
<span class="mono" id="spSel" style="font-size:.85rem;">選取：無</span>
<label class="mono" style="font-size:.85rem;">值 <input id="spValue" type="number" step="1" value="5" style="width:5rem;padding:.3rem;border-radius:6px;border:1px solid var(--card-border);"></label>
<button class="btn btn-step" onclick="spWrite()">寫入</button>
<button class="btn btn-reset" onclick="spReset()">還原預設</button>
<button class="btn btn-reset" onclick="spClear()">清空</button>
</div>
<div id="spStore" class="sp-store"></div>
<div class="status-banner" id="spStatus"><span class="status-icon">›</span><span class="status-text">點一個格子選取它。</span></div>
</div>
</div>
<div class="side-panel">
<div class="info-card">
<div class="ic-title">密度與稀疏度</div>
<div class="mono" id="spDensity" style="font-size:.88rem;line-height:1.9;"></div>
</div>
<div class="info-card">
<div class="ic-title">對照方式</div>
<div style="font-size:.87rem;line-height:1.9;">COO 的第 k 欄是一筆資料：row[k]、col[k]、val[k]。DOK 的鍵是 (row, col)。串列依 row-major 順序串接節點。</div>
</div>
</div>
</div>
